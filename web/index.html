<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hostel_hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hostel_hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Premium dark canvas from the first millisecond */
    html, body {
      background-color: #0A0A0B !important;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }
    
    /* Dynamically recolor Flutter Web's default blue linear progress bar to brand orange */
    div[style*="background-color: #13b9fd"],
    div[style*="background-color: rgb(19, 185, 253)"],
    .flutter-loader {
      background-color: #FF6B35 !important;
    }
    
    /* Recoloring any circular progress spinner dynamic borders to brand orange */
    div[style*="border-top-color: #13b9fd"],
    div[style*="border-top-color: rgb(19, 185, 253)"] {
      border-top-color: #FF6B35 !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
